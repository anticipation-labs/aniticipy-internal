name = "canopy"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets: served before the Worker fetch handler. Matched files (e.g. "/")
# are returned directly; unmatched paths (/ingest, /feed, /mcp) fall through to src/index.ts.
[assets]
directory = "./web/dist"
binding = "ASSETS"

# D1. For local dev and tests the id is a placeholder (Miniflare uses a local sqlite).
# Provisioned in the Anticipy Cloudflare account; `npm run db:migrate:remote` applies migrations/.
[[d1_databases]]
binding = "DB"
database_name = "canopy"
database_id = "4651b392-2a14-462a-8e1f-e3149be7cc54"

[vars]
# GitHub org whose ACTIVE members may sign in. Everyone else gets /?denied=1.
GITHUB_ORG = "anticipation-labs"
GITHUB_REPO = "anticipation-labs/Anticipy"
# Comma-separated GitHub logins allowed to run admin actions (e.g. the server-side backfill).
ADMIN_LOGINS = "Jose-Gael-Cruz-Lopez"

[observability]
enabled = true

# Capture-time PR/issue summaries come from Google Gemini over REST (GEMINI_API_KEY
# secret) — a plain fetch(), not a Cloudflare binding, so no [ai] block is needed.

# Scheduled backstop for the milestone progress cache (event-derived writes are primary).
[triggers]
crons = ["0 */6 * * *"]
